server:
  port: ${PORT:8080}

spring:
  application:
    name: queuesense-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/queuesense}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:QueueSenseSuperSecretKeyForJWTSigningThatIsLongEnough2026!}
    expiration-milliseconds: ${JWT_EXPIRATION_MS:86400000}
  booking:
    grace-period-minutes: ${BOOKING_GRACE_PERIOD_MINS:10}

